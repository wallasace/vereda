<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Vereda</title>
<meta name="description" content="Conversa por voz, texto e tela. Direto de um navegador para o outro.">
<meta name="theme-color" content="#101722">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icons/icon-192.png">
<link rel="apple-touch-icon" href="./icons/icon-192.png">
<style>
:root {
  --bg: #101722;
  --panel: #18212f;
  --panel-2: #1f2a3a;
  --line: #2a3648;
  --ink: #e8eef7;
  --ink-dim: #93a3ba;
  --ink-faint: #64748b;
  --blue: #7fb0ea;
  --green: #4bc89a;
  --red: #e2707a;
  --amber: #e0b062;
  --radius: 12px;
  --shadow: 0 10px 30px rgba(0,0,0,.35);
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    --bg: #f3f6fa; --panel: #fff; --panel-2: #eef2f8; --line: #dde4ee;
    --ink: #16202e; --ink-dim: #55657c; --ink-faint: #8494a9;
    --blue: #2f6fc0; --green: #1d9b74; --red: #c14350; --amber: #9a6b12;
    --shadow: 0 8px 24px rgba(20,35,60,.10);
  }
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, sans-serif;
  -webkit-font-smoothing: antialiased;
  overflow: hidden;
}
button { font: inherit; color: inherit; cursor: pointer; }
input { font: inherit; }

/* ---------- entrada ---------- */
#entrada {
  position: fixed; inset: 0; display: grid; place-items: center;
  padding: 24px; overflow-y: auto; z-index: 20;
}
.cartao {
  width: min(100%, 420px); background: var(--panel); border: 1px solid var(--line);
  border-radius: 16px; padding: 28px; box-shadow: var(--shadow);
}
.marca { display: flex; align-items: center; gap: 10px; margin-bottom: 4px; }
.marca h1 { font-size: 26px; margin: 0; letter-spacing: -.02em; font-weight: 650; }
.marca svg { width: 28px; height: 28px; }
.sub { color: var(--ink-dim); font-size: 13.5px; margin: 0 0 22px; }
label { display: block; font-size: 12px; text-transform: uppercase; letter-spacing: .07em;
        color: var(--ink-faint); margin: 0 0 6px; font-weight: 600; }
.campo { margin-bottom: 16px; }
input[type=text] {
  width: 100%; padding: 11px 13px; background: var(--bg); color: var(--ink);
  border: 1px solid var(--line); border-radius: 10px; outline: none;
}
input[type=text]:focus { border-color: var(--blue); }
.botao {
  width: 100%; padding: 12px; border: 0; border-radius: 10px; font-weight: 600;
  background: var(--blue); color: #08111d; transition: filter .15s;
}
.botao:hover { filter: brightness(1.08); }
.botao:disabled { opacity: .5; cursor: not-allowed; }
.medidor { height: 6px; border-radius: 3px; background: var(--panel-2); overflow: hidden; margin-top: 8px; }
.medidor > i { display: block; height: 100%; width: 0%; background: var(--green); transition: width .08s linear; }
.dica { font-size: 12.5px; color: var(--ink-faint); margin-top: 10px; }
.dica a { color: var(--blue); }
details.avancado { margin: -4px 0 16px; }
details.avancado summary { font-size: 12.5px; color: var(--ink-faint); cursor: pointer; list-style: none; }
details.avancado summary::-webkit-details-marker { display: none; }
details.avancado summary::before { content: "▸ "; }
details.avancado[open] summary::before { content: "▾ "; }
details.avancado > div { margin-top: 12px; }
.erro { color: var(--red); font-size: 13px; margin-top: 10px; min-height: 18px; }

/* ---------- sala ---------- */
#sala { display: none; height: 100%; grid-template-rows: 1fr auto; }
#sala.ativa { display: grid; }
.corpo { display: grid; grid-template-columns: 1fr 0; min-height: 0; transition: grid-template-columns .18s; }
.corpo.com-chat { grid-template-columns: 1fr min(320px, 38vw); }
.palco { position: relative; min-width: 0; display: flex; flex-direction: column; padding: 14px; gap: 12px; }

#tela-wrap { flex: 1; min-height: 0; display: none; position: relative;
             background: #000; border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; }
#tela-wrap.ativa { display: block; }
#tela { width: 100%; height: 100%; object-fit: contain; display: block; }
.legenda { position: absolute; left: 10px; bottom: 10px; background: rgba(8,14,24,.72);
           color: #e8eef7; padding: 5px 10px; border-radius: 8px; font-size: 12.5px; backdrop-filter: blur(6px); }

.grade { flex: 1; min-height: 0; display: grid; gap: 10px; align-content: center;
         justify-content: center; overflow-y: auto;
         grid-template-columns: repeat(auto-fit, minmax(150px, 220px)); }
.corpo.apresentando .grade { flex: 0 0 96px; align-content: start;
         grid-auto-flow: column; grid-template-columns: none; grid-auto-columns: 128px;
         overflow-x: auto; overflow-y: hidden; }

.ficha {
  background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius);
  padding: 16px 10px; display: flex; flex-direction: column; align-items: center;
  gap: 8px; min-width: 0; position: relative;
}
.corpo.apresentando .ficha { padding: 8px 6px; gap: 5px; }
.avatar {
  width: 52px; height: 52px; border-radius: 50%; display: grid; place-items: center;
  font-size: 20px; font-weight: 650; color: #08111d; background: var(--blue);
  box-shadow: 0 0 0 0 rgba(75,200,154,.6); transition: box-shadow .12s;
}
.corpo.apresentando .avatar { width: 34px; height: 34px; font-size: 14px; }
.ficha.falando .avatar { box-shadow: 0 0 0 4px rgba(75,200,154,.55); }
.nome { font-size: 13px; max-width: 100%; overflow: hidden; text-overflow: ellipsis;
        white-space: nowrap; color: var(--ink-dim); }
.corpo.apresentando .nome { font-size: 11.5px; }
.selo { position: absolute; top: 8px; right: 8px; display: flex; gap: 4px; }
.selo svg { width: 15px; height: 15px; }
.selo .mudo { color: var(--red); }
.selo .partilha { color: var(--green); }
.ficha .estado { position: absolute; top: 8px; left: 8px; width: 7px; height: 7px; border-radius: 50%; }
.estado.conectando { background: var(--amber); }
.estado.pronto { background: var(--green); }
.estado.caiu { background: var(--red); }

/* ---------- chat ---------- */
.chat { border-left: 1px solid var(--line); background: var(--panel);
        display: flex; flex-direction: column; min-width: 0; overflow: hidden; }
.chat-lista { flex: 1; overflow-y: auto; padding: 14px; display: flex; flex-direction: column; gap: 12px; }
.msg { font-size: 13.5px; word-break: break-word; }
.msg .quem { font-weight: 650; font-size: 12px; color: var(--blue); }
.msg .quando { font-size: 11px; color: var(--ink-faint); margin-left: 6px; }
.msg.propria .quem { color: var(--green); }
.msg.sistema { color: var(--ink-faint); font-size: 12.5px; font-style: italic; }
.chat-forma { display: flex; gap: 8px; padding: 12px; border-top: 1px solid var(--line); }
.chat-forma input { flex: 1; min-width: 0; }
.chat-forma button { padding: 0 14px; border: 0; border-radius: 10px; background: var(--panel-2); }

/* ---------- controles ---------- */
.barra { display: flex; align-items: center; justify-content: center; gap: 10px;
         padding: 12px 14px calc(12px + env(safe-area-inset-bottom));
         border-top: 1px solid var(--line); background: var(--panel); flex-wrap: wrap; }
.ctrl { display: flex; align-items: center; gap: 8px; padding: 10px 15px; border-radius: 999px;
        border: 1px solid var(--line); background: var(--panel-2); font-size: 13.5px; font-weight: 550; }
.ctrl svg { width: 17px; height: 17px; }
.ctrl:hover { border-color: var(--ink-faint); }
.ctrl.perigo { background: var(--red); border-color: var(--red); color: #fff; }
.ctrl.ligado { background: var(--green); border-color: var(--green); color: #08111d; }
.ctrl.desligado { background: var(--red); border-color: var(--red); color: #fff; }
.ctrl:disabled { opacity: .45; cursor: not-allowed; }
.info { position: absolute; top: 14px; right: 14px; display: flex; gap: 8px; align-items: center;
        font-size: 12px; color: var(--ink-faint); }
.pilula { padding: 3px 9px; border-radius: 999px; background: var(--panel); border: 1px solid var(--line); }
.pilula.aviso { color: var(--amber); border-color: var(--amber); }
.aviso-topo { background: var(--amber); color: #08111d; padding: 8px 14px; font-size: 13px;
              text-align: center; display: none; }
.aviso-topo.ativo { display: block; }
.aviso-topo button { background: transparent; border: 0; text-decoration: underline; font-weight: 650; }
@media (max-width: 620px) {
  .corpo.com-chat { grid-template-columns: 0 1fr; }
  .ctrl span { display: none; }
  .ctrl { padding: 11px 13px; }
}
</style>
</head>
<body>

<div id="aviso" class="aviso-topo"></div>

<!-- ---------------- entrada ---------------- -->
<section id="entrada">
  <div class="cartao">
    <div class="marca">
      <svg viewBox="0 0 24 24" fill="none" stroke="#7fb0ea" stroke-width="1.8" stroke-linecap="round">
        <path d="M3 20c3.5 0 4-5 7.5-5S15 20 21 20"/><path d="M3 12c3.5 0 4-5 7.5-5S15 12 21 12" opacity=".45"/>
      </svg>
      <h1>Vereda</h1>
    </div>
    <p class="sub">Voz, texto e tela. A conversa vai direto de um navegador para o outro.</p>

    <div class="campo">
      <label for="f-nome">Seu nome</label>
      <input type="text" id="f-nome" maxlength="40" placeholder="Como aparecer para os outros" autocomplete="nickname">
    </div>

    <div class="campo">
      <label for="f-sala">Sala</label>
      <input type="text" id="f-sala" maxlength="40" placeholder="nome-da-sala" autocomplete="off" spellcheck="false">
      <div class="dica">Quem abrir o mesmo link cai na mesma sala. Até 10 pessoas.</div>
    </div>

    <details class="avancado">
      <summary>Servidor de sinalização</summary>
      <div>
        <input type="text" id="f-servidor" placeholder="https://vereda.SEU-SUBDOMINIO.workers.dev" spellcheck="false">
        <div class="dica">Onde o seu Worker foi publicado. Fica guardado neste navegador.</div>
      </div>
    </details>

    <div class="campo">
      <label>Microfone</label>
      <div class="medidor"><i id="f-nivel"></i></div>
      <div class="dica" id="f-mic">Pedindo permissão…</div>
    </div>

    <button class="botao" id="f-entrar" disabled>Entrar</button>
    <div class="erro" id="f-erro"></div>
  </div>
</section>

<!-- ---------------- sala ---------------- -->
<section id="sala">
  <div class="corpo" id="corpo">
    <div class="palco">
      <div class="info">
        <span class="pilula" id="i-sala"></span>
        <span class="pilula" id="i-rede">conectando</span>
      </div>
      <div id="tela-wrap"><video id="tela" autoplay playsinline muted></video>
        <div class="legenda" id="tela-legenda"></div>
      </div>
      <div class="grade" id="grade"></div>
    </div>
    <aside class="chat" id="chat">
      <div class="chat-lista" id="chat-lista"></div>
      <form class="chat-forma" id="chat-forma">
        <input type="text" id="chat-texto" placeholder="Escreva uma mensagem" maxlength="2000" autocomplete="off">
        <button type="submit">Enviar</button>
      </form>
    </aside>
  </div>

  <div class="barra">
    <button class="ctrl ligado" id="b-mic">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
        <rect x="9" y="2" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0014 0M12 18v4"/>
      </svg><span id="b-mic-txt">Microfone</span>
    </button>
    <button class="ctrl" id="b-tela">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
        <rect x="2" y="4" width="20" height="13" rx="2"/><path d="M8 21h8M12 17v4"/>
      </svg><span id="b-tela-txt">Tela</span>
    </button>
    <button class="ctrl" id="b-chat">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
        <path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z"/>
      </svg><span>Chat</span>
    </button>
    <button class="ctrl" id="b-link">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
        <path d="M10 13a5 5 0 007 0l3-3a5 5 0 00-7-7l-1 1"/><path d="M14 11a5 5 0 00-7 0l-3 3a5 5 0 007 7l1-1"/>
      </svg><span id="b-link-txt">Copiar link</span>
    </button>
    <button class="ctrl perigo" id="b-sair">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
        <path d="M16 17l5-5-5-5M21 12H9M9 3H6a2 2 0 00-2 2v14a2 2 0 002 2h3"/>
      </svg><span>Sair</span>
    </button>
  </div>
</section>

<div id="audios" style="position:absolute;width:0;height:0;overflow:hidden"></div>

<script>
(() => {
'use strict';

// Preencha depois de publicar o Worker e o campo "Servidor" some da tela inicial.
const SIGNAL_DEFAULT = '';

// Teto de upload de quem apresenta a tela, dividido entre os participantes.
// Em malha, o apresentador sobe uma cópia do vídeo para cada pessoa; 5 Mbps é
// o que um link doméstico brasileiro razoável aguenta sem engasgar a voz.
const ORCAMENTO_TELA = 5e6;
const TETO_POR_PAR = 1.5e6;
const PISO_POR_PAR = 250e3;

const $ = (s) => document.querySelector(s);
const cria = (t, c) => { const n = document.createElement(t); if (c) n.className = c; return n; };
const limpaSala = (s) => s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '')
                          .replace(/[^a-z0-9-]/g, '-').replace(/-+/g, '-').replace(/^-|-$/g, '').slice(0, 40);

// ---------------------------------------------------------------- estado

const eu = { id: null, nome: '', mudo: false, apresentando: false };
const pares = new Map();   // id -> { id, nome, mudo, apresentando, ficha, audio, tela }
let servidor = '', sala = '';
let micStream = null, micTrack = null, telaStream = null;
let ice = { iceServers: [{ urls: ['stun:stun.cloudflare.com:3478'] }], turn: false };
let audioCtx = null;
let ws = null, tentativas = 0, saindo = false;

// ---------------------------------------------------------------- nível de voz
// Um laço só para todos os medidores: cada AnalyserNode extra custa quase nada,
// um requestAnimationFrame por pessoa custaria.

const niveis = new Map();

function escutarNivel(id, stream, aoNivel) {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  if (audioCtx.state === 'suspended') audioCtx.resume().catch(() => {});
  try {
    const an = audioCtx.createAnalyser();
    an.fftSize = 512;
    an.smoothingTimeConstant = 0.55;
    audioCtx.createMediaStreamSource(stream).connect(an);
    niveis.set(id, { an, dados: new Uint8Array(an.fftSize), aoNivel, falando: false });
  } catch (e) { console.warn('medidor', e); }
}

const esquecerNivel = (id) => niveis.delete(id);

(function pulso() {
  for (const [, n] of niveis) {
    n.an.getByteTimeDomainData(n.dados);
    let soma = 0;
    for (let i = 0; i < n.dados.length; i++) { const v = (n.dados[i] - 128) / 128; soma += v * v; }
    const rms = Math.sqrt(soma / n.dados.length);
    // Histerese: entra a 0,05 e só sai a 0,03, senão o anel pisca em cada pausa.
    const falando = n.falando ? rms > 0.03 : rms > 0.05;
    if (falando !== n.falando) { n.falando = falando; n.aoNivel(falando, rms); }
    else if (n.aoNivel.continuo) n.aoNivel(falando, rms);
  }
  requestAnimationFrame(pulso);
})();

// ---------------------------------------------------------------- malha de mídia
// A costura onde o SFU entra depois: quem chama isso só conhece abrir/fechar,
// iniciarTela/pararTela. Trocar malha por SFU é trocar este bloco.

const malha = (() => {
  const cons = new Map(); // id -> { pc, educado, fazendoOferta, ignorando, telaIds }
  let aoAudio = () => {}, aoTela = () => {}, aoRede = () => {};

  const enviar = (para, dados) => manda({ t: 'signal', to: para, data: dados });

  function abrir(id) {
    if (cons.has(id)) return cons.get(id);

    const pc = new RTCPeerConnection(ice);
    // Papéis fixos e opostos nos dois lados, decididos pelo id: quando os dois
    // fazem oferta ao mesmo tempo, o "educado" cede e a colisão se resolve
    // sozinha, sem ninguém precisar esperar a vez.
    const c = { pc, educado: eu.id < id, fazendoOferta: false, ignorando: false, telaIds: new Set() };
    cons.set(id, c);

    // Sem faixa nenhuma o onnegotiationneeded nunca dispara e quem entrou só
    // para ouvir ficaria sozinho. Um transceptor recvonly basta para a
    // negociação começar.
    if (micTrack) pc.addTrack(micTrack, micStream);
    else pc.addTransceiver('audio', { direction: 'recvonly' });
    if (telaStream) {
      enviar(id, { telaId: telaStream.id });
      for (const t of telaStream.getTracks()) pc.addTrack(t, telaStream);
    }

    pc.onnegotiationneeded = async () => {
      try {
        c.fazendoOferta = true;
        await pc.setLocalDescription();
        enviar(id, { descricao: pc.localDescription });
      } catch (e) { console.warn('negociação', e); }
      finally { c.fazendoOferta = false; }
    };

    pc.onicecandidate = ({ candidate }) => { if (candidate) enviar(id, { candidato: candidate }); };
    pc.onconnectionstatechange = () => aoRede(id, pc.connectionState);

    pc.ontrack = (ev) => {
      const fluxo = ev.streams[0] || new MediaStream([ev.track]);
      if (ev.track.kind === 'video') aoTela(id, fluxo);
      else aoAudio(id, fluxo, c.telaIds.has(fluxo.id));
    };

    ajustarBanda();
    return c;
  }

  function fechar(id) {
    const c = cons.get(id);
    if (!c) return;
    try { c.pc.close(); } catch {}
    cons.delete(id);
    ajustarBanda();
  }

  function fecharTudo() { for (const id of [...cons.keys()]) fechar(id); }

  async function receber(id, dados) {
    const c = abrir(id);
    const { pc } = c;
    try {
      // Chega antes dos tracks, pelo mesmo WebSocket e portanto em ordem: é como
      // o outro lado distingue o áudio da tela do áudio do microfone.
      if (dados.telaId) { c.telaIds.add(dados.telaId); return; }

      if (dados.descricao) {
        const colisao = dados.descricao.type === 'offer' &&
                        (c.fazendoOferta || pc.signalingState !== 'stable');
        c.ignorando = !c.educado && colisao;
        if (c.ignorando) return;
        await pc.setRemoteDescription(dados.descricao);
        if (dados.descricao.type === 'offer') {
          await pc.setLocalDescription();
          enviar(id, { descricao: pc.localDescription });
        }
      } else if (dados.candidato) {
        try { await pc.addIceCandidate(dados.candidato); }
        catch (e) { if (!c.ignorando) throw e; }
      }
    } catch (e) { console.warn('sinal', e); }
  }

  // Refeito a cada entrada e saída: o que cabe para três pessoas sufoca o link
  // com nove.
  function ajustarBanda() {
    const n = Math.max(1, cons.size);
    const teto = Math.max(PISO_POR_PAR, Math.min(TETO_POR_PAR, ORCAMENTO_TELA / n));
    for (const { pc } of cons.values()) {
      for (const s of pc.getSenders()) {
        if (s.track?.kind !== 'video') continue;
        const p = s.getParameters();
        if (!p.encodings?.length) p.encodings = [{}];
        p.encodings[0].maxBitrate = teto;
        p.encodings[0].maxFramerate = 12;
        s.setParameters(p).catch(() => {});
      }
    }
    return teto;
  }

  async function iniciarTela() {
    const s = await navigator.mediaDevices.getDisplayMedia({
      video: { frameRate: { ideal: 12, max: 15 }, width: { max: 1920 } },
      audio: true,
    });
    telaStream = s;
    const v = s.getVideoTracks()[0];
    // Slides e código valem mais nítidos do que fluidos: o contentHint diz ao
    // codificador para gastar os bits em detalhe, não em quadros por segundo.
    if ('contentHint' in v) v.contentHint = 'detail';
    v.addEventListener('ended', () => pararTela(true));

    for (const [id, c] of cons) {
      enviar(id, { telaId: s.id });
      for (const t of s.getTracks()) c.pc.addTrack(t, s);
    }
    return ajustarBanda();
  }

  function pararTela() {
    if (!telaStream) return;
    const ids = new Set(telaStream.getTracks().map((t) => t.id));
    for (const { pc } of cons.values())
      for (const s of pc.getSenders())
        if (s.track && ids.has(s.track.id)) { try { pc.removeTrack(s); } catch {} }
    telaStream.getTracks().forEach((t) => t.stop());
    telaStream = null;
  }

  return {
    abrir, fechar, fecharTudo, receber, iniciarTela, pararTela, ajustarBanda,
    ligar(h) { aoAudio = h.aoAudio; aoTela = h.aoTela; aoRede = h.aoRede; },
    get tamanho() { return cons.size; },
  };
})();

// ---------------------------------------------------------------- sinalização

function manda(m) { if (ws && ws.readyState === 1) ws.send(JSON.stringify(m)); }

function conectar() {
  const base = servidor.replace(/\/+$/, '').replace(/^http/, 'ws');
  ws = new WebSocket(`${base}/room/${sala}?name=${encodeURIComponent(eu.nome)}`);

  ws.onopen = () => { tentativas = 0; pilulaRede('na sala', ''); };
  ws.onmessage = (ev) => { try { trata(JSON.parse(ev.data)); } catch (e) { console.warn(e); } };
  ws.onerror = () => {};

  ws.onclose = () => {
    if (saindo) return;
    // A sessão inteira é refeita na volta: o servidor dá um id novo a cada
    // conexão, e os pares antigos apontam para um id que não existe mais.
    malha.fecharTudo();
    for (const id of [...pares.keys()]) tiraPar(id);
    eu.id = null;
    tentativas++;
    const espera = Math.min(1000 * 2 ** (tentativas - 1), 15000);
    pilulaRede(`reconectando em ${Math.round(espera / 1000)}s`, 'aviso');
    setTimeout(() => { if (!saindo) conectar(); }, espera);
  };
}

function trata(m) {
  switch (m.t) {
    case 'welcome':
      eu.id = m.id;
      poePar({ ...eu, sou: true });
      m.peers.forEach((p) => { poePar(p); malha.abrir(p.id); });
      manda({ t: 'state', muted: eu.mudo, sharing: eu.apresentando });
      break;

    case 'join':
      poePar(m);
      malha.abrir(m.id);
      sistema(`${m.name} entrou`);
      break;

    case 'leave': {
      const p = pares.get(m.id);
      if (p) sistema(`${p.nome} saiu`);
      malha.fechar(m.id);
      tiraPar(m.id);
      palco();
      break;
    }

    case 'signal': malha.receber(m.from, m.data); break;

    case 'chat': mensagem(m.name, m.text, m.ts, m.from === eu.id); break;

    case 'state': {
      const p = pares.get(m.id);
      if (!p) break;
      p.mudo = m.muted;
      p.apresentando = m.sharing;
      pinta(p);
      palco();
      break;
    }

    case 'error':
      if (m.code === 'share_busy') {
        eu.apresentando = false;
        pinta(pares.get(eu.id));
        botaoTela();
        avisa('Outra pessoa já está apresentando. Uma tela por vez.');
      }
      break;
  }
}

// ---------------------------------------------------------------- participantes

function cor(id) {
  let h = 0;
  for (let i = 0; i < id.length; i++) h = (h * 31 + id.charCodeAt(i)) % 360;
  return `hsl(${h} 62% 68%)`;
}
const inicial = (n) => (n.trim()[0] || '?').toUpperCase();

function poePar(p) {
  const id = p.id;
  if (pares.has(id)) return pares.get(id);

  const par = {
    id, nome: p.nome || p.name || 'alguém',
    mudo: !!p.mudo || !!p.muted, apresentando: !!p.apresentando || !!p.sharing,
    sou: !!p.sou, tela: null, audio: null, telaAudio: null,
  };

  const f = cria('div', 'ficha');
  f.dataset.id = id;
  const estado = cria('span', 'estado ' + (par.sou ? 'pronto' : 'conectando'));
  const av = cria('div', 'avatar');
  av.textContent = inicial(par.nome);
  av.style.background = cor(id);
  const nm = cria('div', 'nome');
  nm.textContent = par.sou ? `${par.nome} (você)` : par.nome;
  const selo = cria('div', 'selo');
  f.append(estado, av, nm, selo);
  $('#grade').append(f);

  par.ficha = f;
  pares.set(id, par);
  pinta(par);

  if (par.sou && micStream) {
    escutarNivel(id, micStream, (falando) => f.classList.toggle('falando', falando && !eu.mudo));
  }
  return par;
}

function tiraPar(id) {
  const p = pares.get(id);
  if (!p) return;
  esquecerNivel(id);
  p.ficha?.remove();
  p.audio?.remove();
  p.telaAudio?.remove();
  pares.delete(id);
}

const ICONE_MUDO = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" class="mudo"><path d="M3 3l18 18"/><path d="M9 9v3a3 3 0 004.6 2.5"/><path d="M15 11V5a3 3 0 00-5.9-.7"/><path d="M5 11a7 7 0 0010.3 6.2M12 19v3"/></svg>';
const ICONE_TELA = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" class="partilha"><rect x="2" y="4" width="20" height="13" rx="2"/><path d="M8 21h8"/></svg>';

function pinta(p) {
  if (!p) return;
  const selo = p.ficha.querySelector('.selo');
  selo.innerHTML = (p.mudo ? ICONE_MUDO : '') + (p.apresentando ? ICONE_TELA : '');
  if (p.mudo) p.ficha.classList.remove('falando');
}

function rede(id, estado) {
  const p = pares.get(id);
  if (!p) return;
  const e = p.ficha.querySelector('.estado');
  e.className = 'estado ' + (estado === 'connected' ? 'pronto'
    : estado === 'failed' || estado === 'disconnected' || estado === 'closed' ? 'caiu' : 'conectando');
}

// ---------------------------------------------------------------- palco e áudio

function palco() {
  const quem = [...pares.values()].find((p) => p.apresentando);
  const wrap = $('#tela-wrap');
  const corpo = $('#corpo');

  if (!quem || (!quem.sou && !quem.tela) || (quem.sou && !telaStream)) {
    wrap.classList.remove('ativa');
    corpo.classList.remove('apresentando');
    $('#tela').srcObject = null;
    return;
  }
  const fluxo = quem.sou ? telaStream : quem.tela;
  if ($('#tela').srcObject !== fluxo) $('#tela').srcObject = fluxo;
  $('#tela-legenda').textContent = quem.sou ? 'sua tela' : `tela de ${quem.nome}`;
  wrap.classList.add('ativa');
  corpo.classList.add('apresentando');
}

function toca(stream) {
  const a = cria('audio');
  a.autoplay = true;
  a.playsInline = true;
  a.srcObject = stream;
  $('#audios').append(a);
  // O navegador pode recusar o áudio automático mesmo depois do clique em
  // Entrar. Quando recusa, avisa em vez de ficar mudo em silêncio.
  a.play().catch(() => avisa('Toque em qualquer lugar da página para liberar o áudio.', true));
  return a;
}

// ---------------------------------------------------------------- chat

function linha(cls) {
  const d = cria('div', 'msg ' + cls);
  const lista = $('#chat-lista');
  const colado = lista.scrollTop + lista.clientHeight >= lista.scrollHeight - 40;
  lista.append(d);
  if (colado) lista.scrollTop = lista.scrollHeight;
  return d;
}

function mensagem(nome, texto, ts, propria) {
  const d = linha(propria ? 'propria' : '');
  const h = new Date(ts).toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
  d.innerHTML = `<span class="quem"></span><span class="quando"></span><div class="corpo-msg"></div>`;
  d.querySelector('.quem').textContent = nome;
  d.querySelector('.quando').textContent = h;
  d.querySelector('.corpo-msg').textContent = texto;
  if (!propria && !$('#corpo').classList.contains('com-chat')) $('#b-chat').classList.add('ligado');
}

function sistema(texto) { linha('sistema').textContent = texto; }

// ---------------------------------------------------------------- avisos

let avisoTimer = null;
function avisa(texto, fixo) {
  const a = $('#aviso');
  a.textContent = texto;
  a.classList.add('ativo');
  clearTimeout(avisoTimer);
  if (!fixo) avisoTimer = setTimeout(() => a.classList.remove('ativo'), 6000);
}
function pilulaRede(texto, cls) {
  const p = $('#i-rede');
  p.textContent = texto + (ice.turn ? '' : ' · sem TURN');
  p.className = 'pilula ' + (cls || (ice.turn ? '' : 'aviso'));
}

// ---------------------------------------------------------------- controles

malha.ligar({
  aoAudio(id, fluxo, ehDaTela) {
    const p = pares.get(id);
    if (!p) return;
    if (ehDaTela) { p.telaAudio?.remove(); p.telaAudio = toca(fluxo); return; }
    p.audio?.remove();
    p.audio = toca(fluxo);
    escutarNivel(id, fluxo, (falando) => p.ficha.classList.toggle('falando', falando && !p.mudo));
  },
  aoTela(id, fluxo) {
    const p = pares.get(id);
    if (!p) return;
    p.tela = fluxo;
    palco();
  },
  aoRede(id, estado) { rede(id, estado); },
});

function botaoMic() {
  const b = $('#b-mic');
  b.classList.toggle('ligado', !eu.mudo);
  b.classList.toggle('desligado', eu.mudo);
  $('#b-mic-txt').textContent = eu.mudo ? 'Mudo' : 'Microfone';
}

function botaoTela() {
  const b = $('#b-tela');
  b.classList.toggle('ligado', eu.apresentando);
  $('#b-tela-txt').textContent = eu.apresentando ? 'Parar' : 'Tela';
}

$('#b-mic').onclick = () => {
  eu.mudo = !eu.mudo;
  if (micTrack) micTrack.enabled = !eu.mudo;
  const p = pares.get(eu.id);
  if (p) { p.mudo = eu.mudo; pinta(p); }
  manda({ t: 'state', muted: eu.mudo, sharing: eu.apresentando });
  botaoMic();
};

$('#b-tela').onclick = () => (eu.apresentando ? pararApresentar() : apresentar());

async function apresentar() {
  const outro = [...pares.values()].find((p) => p.apresentando && !p.sou);
  if (outro) return avisa(`${outro.nome} já está apresentando. Uma tela por vez.`);

  try {
    const teto = await malha.iniciarTela();
    eu.apresentando = true;
    const p = pares.get(eu.id);
    if (p) { p.apresentando = true; pinta(p); }
    manda({ t: 'state', muted: eu.mudo, sharing: true });
    telaStream.getVideoTracks()[0].addEventListener('ended', pararApresentar);
    botaoTela();
    palco();

    // Em malha o vídeo sai uma vez por pessoa. Acima de quatro, quem apresenta
    // precisa saber quanto está subindo — é aqui que o link rural reclama.
    if (malha.tamanho > 4) {
      const mbps = Math.round((teto * malha.tamanho) / 1e5) / 10;
      avisa(`Apresentando para ${malha.tamanho} pessoas: cerca de ${mbps} Mbps de upload.`);
    }
  } catch (e) {
    if (e.name !== 'NotAllowedError') avisa('Não consegui capturar a tela: ' + e.message);
  }
}

function pararApresentar() {
  malha.pararTela();
  eu.apresentando = false;
  const p = pares.get(eu.id);
  if (p) { p.apresentando = false; pinta(p); }
  manda({ t: 'state', muted: eu.mudo, sharing: false });
  botaoTela();
  palco();
}

$('#b-chat').onclick = () => {
  const aberto = $('#corpo').classList.toggle('com-chat');
  $('#b-chat').classList.toggle('ligado', aberto);
  if (aberto) { $('#chat-texto').focus(); $('#chat-lista').scrollTop = $('#chat-lista').scrollHeight; }
};

$('#chat-forma').onsubmit = (e) => {
  e.preventDefault();
  const t = $('#chat-texto').value;
  if (!t.trim()) return;
  manda({ t: 'chat', text: t });
  $('#chat-texto').value = '';
};

$('#b-link').onclick = async () => {
  const url = location.origin + location.pathname + '#' + sala;
  try { await navigator.clipboard.writeText(url); $('#b-link-txt').textContent = 'Copiado'; }
  catch { prompt('Copie o link da sala:', url); }
  setTimeout(() => { $('#b-link-txt').textContent = 'Copiar link'; }, 2000);
};

$('#b-sair').onclick = () => {
  saindo = true;
  pararApresentar();
  malha.fecharTudo();
  try { ws?.close(); } catch {}
  micStream?.getTracks().forEach((t) => t.stop());
  location.reload();
};

// ---------------------------------------------------------------- entrada

const erro = (t) => { $('#f-erro').textContent = t || ''; };

async function prepararMic() {
  try {
    micStream = await navigator.mediaDevices.getUserMedia({
      audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true },
      video: false,
    });
    micTrack = micStream.getAudioTracks()[0];
    $('#f-mic').textContent = micTrack.label || 'Microfone pronto.';
    $('#f-entrar').disabled = false;

    const aoNivel = (falando, rms) => { $('#f-nivel').style.width = Math.min(100, rms * 280) + '%'; };
    aoNivel.continuo = true;
    escutarNivel('__entrada', micStream, aoNivel);
  } catch (e) {
    $('#f-mic').textContent = e.name === 'NotAllowedError'
      ? 'Permissão negada. Libere o microfone nas configurações do site.'
      : 'Nenhum microfone encontrado.';
    // Sem microfone ainda dá para entrar e ouvir, só não dá para falar.
    $('#f-entrar').disabled = false;
    $('#f-entrar').textContent = 'Entrar só para ouvir';
  }
}

async function entrar() {
  erro('');
  eu.nome = $('#f-nome').value.trim().slice(0, 40) || 'alguém';
  sala = limpaSala($('#f-sala').value);
  servidor = ($('#f-servidor').value.trim() || SIGNAL_DEFAULT).replace(/\/+$/, '');

  if (!sala) return erro('Escolha um nome para a sala.');
  if (!servidor) return erro('Informe o endereço do servidor de sinalização.');
  if (!/^https?:\/\//.test(servidor)) return erro('O endereço do servidor precisa começar com https://');

  $('#f-entrar').disabled = true;
  $('#f-entrar').textContent = 'Conectando…';

  // O /ice serve de duas coisas: traz as credenciais do TURN e prova que o
  // servidor responde, antes de abrir o WebSocket e ficar no escuro.
  try {
    const r = await fetch(servidor + '/ice', { cache: 'no-store' });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    ice = await r.json();
  } catch (e) {
    $('#f-entrar').disabled = false;
    $('#f-entrar').textContent = 'Entrar';
    return erro('Não alcancei o servidor de sinalização. Confira o endereço.');
  }

  localStorage.setItem('vereda:nome', eu.nome);
  localStorage.setItem('vereda:servidor', servidor);
  history.replaceState(null, '', '#' + sala);

  esquecerNivel('__entrada');
  audioCtx?.resume().catch(() => {});

  $('#entrada').style.display = 'none';
  $('#sala').classList.add('ativa');
  $('#i-sala').textContent = sala;
  pilulaRede('conectando', '');
  if (!ice.turn) {
    sistema('Sem TURN configurado: a chamada só fecha entre redes que aceitam conexão direta.');
  }
  if (!micTrack) {
    // Sem microfone não há o que silenciar, e os outros precisam ver isso na
    // ficha em vez de esperar por uma voz que não vem.
    eu.mudo = true;
    $('#b-mic').disabled = true;
    $('#b-mic-txt').textContent = 'Sem microfone';
  }
  botaoMic();
  conectar();
}

$('#f-entrar').onclick = entrar;
for (const id of ['#f-nome', '#f-sala', '#f-servidor']) {
  $(id).addEventListener('keydown', (e) => { if (e.key === 'Enter') entrar(); });
}

// Alguns navegadores só liberam áudio depois de um toque na página.
addEventListener('click', () => {
  audioCtx?.resume().catch(() => {});
  $('#audios').querySelectorAll('audio').forEach((a) => a.play().catch(() => {}));
}, { passive: true });

addEventListener('beforeunload', () => { saindo = true; try { ws?.close(); } catch {} });

// ---------------------------------------------------------------- início

$('#f-nome').value = localStorage.getItem('vereda:nome') || '';
$('#f-servidor').value = localStorage.getItem('vereda:servidor') || SIGNAL_DEFAULT;
$('#f-sala').value = limpaSala(decodeURIComponent(location.hash.slice(1)));
if (SIGNAL_DEFAULT && !localStorage.getItem('vereda:servidor')) {
  document.querySelector('details.avancado').style.display = 'none';
}
($('#f-nome').value ? $('#f-sala') : $('#f-nome')).focus();
prepararMic();

if ('serviceWorker' in navigator && location.protocol === 'https:') {
  addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(() => {}));
}
})();
</script>
</body>
</html>
