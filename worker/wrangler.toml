name = "vereda"
main = "src/index.js"
compatibility_date = "2026-09-01"

# O limite de pessoas por sala. Dez é o teto testado da malha P2P; acima disso
# o upload de quem apresenta a tela vira o gargalo.
[vars]
ROOM_CAP = "10"

[[durable_objects.bindings]]
name = "ROOM"
class_name = "Room"

# Um único objeto ('global'), contando salas e pessoas para o painel em
# /admin. Opcional por natureza: Room já checa `if (!this.env.REGISTRO)
# return` antes de usar — tirar este binding não quebra as salas, só apaga o
# painel.
[[durable_objects.bindings]]
name = "REGISTRO"
class_name = "Registro"

# Um objeto por IP, contando tentativas erradas de código de acesso — é o
# freio contra adivinhação por força bruta. Opcional como o REGISTRO: sem
# este binding, o gate de acesso continua funcionando, só sem bloqueio por
# excesso de tentativas.
[[durable_objects.bindings]]
name = "LIMITE"
class_name = "LimiteTaxa"

# Um único objeto ('global'), estimando o uso do SFU (Cloudflare Realtime)
# contra o teto de 50% do plano grátis — ver comentário completo em
# UsoSfu, em src/index.js.
[[durable_objects.bindings]]
name = "USO_SFU"
class_name = "UsoSfu"

# new_sqlite_classes, e não new_classes: o plano gratuito de Durable Objects só
# atende objetos com armazenamento SQLite.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["Registro"]

[[migrations]]
tag = "v3"
new_sqlite_classes = ["LimiteTaxa"]

[[migrations]]
tag = "v4"
new_sqlite_classes = ["UsoSfu"]

[observability]
enabled = true
