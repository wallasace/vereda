name = "vereda"
main = "src/index.js"
compatibility_date = "2026-09-01"

# O limite de pessoas por sala. Dez é o teto testado da malha P2P; acima disso
# o upload de quem apresenta a tela vira o gargalo.
[vars]
ROOM_CAP = "10"

[[durable_objects.bindings]]
name = "ROOM"
class_name = "Room"

# Um único objeto ('global'), contando salas e pessoas para o painel em
# /admin. Opcional por natureza: Room já checa `if (!this.env.REGISTRO)
# return` antes de usar — tirar este binding não quebra as salas, só apaga o
# painel.
[[durable_objects.bindings]]
name = "REGISTRO"
class_name = "Registro"

# new_sqlite_classes, e não new_classes: o plano gratuito de Durable Objects só
# atende objetos com armazenamento SQLite.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["Registro"]

[observability]
enabled = true
